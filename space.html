<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Space Siege - My Arcade</title>
<link rel="stylesheet" href="style.css">
<style>
  canvas {
    image-rendering: pixelated;
  }
  #hearts-bottom {
    position: absolute;
    bottom: 12px;
    right: 16px;
    font-size: 1.8rem;
    color: #f33;
    letter-spacing: 4px;
  }
  #controls {
    position: absolute;
    bottom: 10px;
    left: 50%;
    transform: translateX(-50%);
    font-size: 0.85rem;
    color: #999;
    text-align: center;
  }
</style>
</head>
<body>
<div id="wrap">
  <a class="back-link" href="index.html">Menu</a>
  <canvas id="game" width="640" height="680"></canvas>
  <div id="hearts-bottom"></div>
  <div id="controls">A/D or &larr;/&rarr; move &middot; Space (hold) to fire</div>
  <div id="message">
    <span id="message-text"></span>
    <button id="restart">Play again</button>
  </div>
</div>
<script>
const canvas = document.getElementById('game');
const ctx = canvas.getContext('2d');
const heartsEl = document.getElementById('hearts-bottom');
const messageEl = document.getElementById('message');
const messageTextEl = document.getElementById('message-text');
const restartBtn = document.getElementById('restart');

const PIXEL = 5;
const START_HEARTS = 3;
const INVINCIBLE_MS = 1000;
const ENEMY_SPAWN_DELAY = 4000;
const ENEMY_ENTER_MS = 1500;
const FIRE_COOLDOWN = 1000 / 3;
const PLAYER_SPEED = 260;
const BULLET_SPEED = 480;
const BALL_SPEED_Y = 220;
const ENEMY_MAX_HEALTH = 251;
const BULLET_DAMAGE = 25;

const PLAYER_SPRITE = [
  '.Y......Y.',
  '.Y......Y.',
  '.YYYYYYYY.',
  'YYYYYYYYYY',
  'YYYKKKKYYY',
  'YYYYYYYYYY',
  'YY.YYYY.YY',
  'Y..YYYY..Y'
];
const PLAYER_COLORS = { Y: '#ffd500', K: '#141414' };

const ENEMY_SPRITE = [
  '..R....R..',
  '.RRR..RRR.',
  'RRRRRRRRRR',
  'RRRKKKKRRR',
  'RRRRRRRRRR',
  '..R.RR.R..',
  '.R.R..R.R.',
  'R.R....R.R'
];
const ENEMY_COLORS = { R: '#ff2a2a', K: '#141414' };

const SPRITE_W = PLAYER_SPRITE[0].length * PIXEL;
const SPRITE_H = PLAYER_SPRITE.length * PIXEL;
const TURRET_COLS = [1, 8];

function drawSprite(grid, colors, x, y) {
  for (let row = 0; row < grid.length; row++) {
    for (let col = 0; col < grid[row].length; col++) {
      const ch = grid[row][col];
      if (ch === '.') continue;
      ctx.fillStyle = colors[ch];
      ctx.fillRect(x + col * PIXEL, y + row * PIXEL, PIXEL, PIXEL);
    }
  }
}

const stars = [];
for (let i = 0; i < 120; i++) {
  stars.push({
    x: Math.random() * canvas.width,
    y: Math.random() * canvas.height,
    size: Math.random() < 0.8 ? 1 : 2,
    speed: 10 + Math.random() * 30,
    alpha: 0.3 + Math.random() * 0.7
  });
}

let player, bullets, enemies, balls, explosions, hearts, gameOver, gameStart, enemiesSpawned, nextTurret, spaceHeld, fireCooldown, leftHeld, rightHeld, lastTime;

function makeEnemy(cx) {
  return {
    x: cx - SPRITE_W / 2,
    y: -SPRITE_H,
    targetY: 110,
    entering: true,
    enterStart: performance.now(),
    health: ENEMY_MAX_HEALTH,
    alive: true,
    exploding: false,
    explodeStart: 0,
    nextShotTime: 0,
    firstShotSet: false
  };
}

function resetGame() {
  player = {
    x: canvas.width / 2 - SPRITE_W / 2,
    y: canvas.height - 90,
    vx: 0,
    invincibleUntil: 0
  };
  bullets = [];
  enemies = [];
  balls = [];
  explosions = [];
  hearts = START_HEARTS;
  gameOver = false;
  gameStart = performance.now();
  enemiesSpawned = false;
  nextTurret = 0;
  spaceHeld = false;
  fireCooldown = 0;
  leftHeld = false;
  rightHeld = false;
  lastTime = performance.now();

  updateHearts();
  messageEl.style.display = 'none';
}

function updateHearts() {
  heartsEl.textContent = '❤'.repeat(Math.max(hearts, 0)) + '♡'.repeat(START_HEARTS - Math.max(hearts, 0));
}

function endGame(won) {
  gameOver = true;
  messageTextEl.textContent = won ? 'You Win!' : 'You Lose!';
  messageEl.style.display = 'block';
}

window.addEventListener('keydown', (e) => {
  const key = e.key.toLowerCase();
  if (['arrowleft', 'arrowright', 'a', 'd', ' '].includes(key)) {
    e.preventDefault();
  }
  if (gameOver) return;
  if (key === 'a' || key === 'arrowleft') leftHeld = true;
  else if (key === 'd' || key === 'arrowright') rightHeld = true;
  else if (key === ' ') spaceHeld = true;
});

window.addEventListener('keyup', (e) => {
  const key = e.key.toLowerCase();
  if (key === 'a' || key === 'arrowleft') leftHeld = false;
  else if (key === 'd' || key === 'arrowright') rightHeld = false;
  else if (key === ' ') spaceHeld = false;
});

restartBtn.addEventListener('click', resetGame);

function fireBullet() {
  const col = TURRET_COLS[nextTurret];
  nextTurret = 1 - nextTurret;
  bullets.push({
    x: player.x + col * PIXEL + PIXEL / 2,
    y: player.y
  });
}

function enemyFire(enemy) {
  const originX = enemy.x + SPRITE_W / 2;
  const originY = enemy.y + SPRITE_H;
  const dy = player.y - originY;
  const t = dy / BALL_SPEED_Y;
  const predictedX = player.x + SPRITE_W / 2 + player.vx * t;
  const dx = predictedX - originX;
  balls.push({
    x: originX,
    y: originY,
    vx: dx / t,
    vy: BALL_SPEED_Y
  });
}

function rectsOverlap(ax, ay, aw, ah, bx, by, bw, bh) {
  return ax < bx + bw && ax + aw > bx && ay < by + bh && ay + ah > by;
}

function update(dt, now) {
  if (gameOver) return;

  player.vx = rightHeld && !leftHeld ? PLAYER_SPEED : (leftHeld && !rightHeld ? -PLAYER_SPEED : 0);
  player.x += player.vx * (dt / 1000);
  player.x = Math.min(Math.max(player.x, 0), canvas.width - SPRITE_W);

  if (spaceHeld) {
    fireCooldown -= dt;
    if (fireCooldown <= 0) {
      fireBullet();
      fireCooldown = FIRE_COOLDOWN;
    }
  } else {
    fireCooldown = 0;
  }

  if (!enemiesSpawned && now - gameStart >= ENEMY_SPAWN_DELAY) {
    enemiesSpawned = true;
    const centers = [canvas.width * 0.25, canvas.width * 0.5, canvas.width * 0.75];
    centers.forEach((cx) => enemies.push(makeEnemy(cx)));
  }

  enemies.forEach((enemy) => {
    if (!enemy.alive) return;

    if (enemy.exploding) {
      if (now - enemy.explodeStart > 500) {
        enemy.alive = false;
      }
      return;
    }

    if (enemy.entering) {
      const t = Math.min((now - enemy.enterStart) / ENEMY_ENTER_MS, 1);
      enemy.y = -SPRITE_H + (enemy.targetY - (-SPRITE_H)) * t;
      if (t >= 1) {
        enemy.entering = false;
        enemy.nextShotTime = now + 1000 + Math.random() * 2000;
      }
      return;
    }

    if (now >= enemy.nextShotTime) {
      enemyFire(enemy);
      enemy.nextShotTime = now + 5000;
    }
  });

  for (let i = bullets.length - 1; i >= 0; i--) {
    const b = bullets[i];
    b.y -= BULLET_SPEED * (dt / 1000);
    if (b.y < -20) {
      bullets.splice(i, 1);
      continue;
    }
    for (const enemy of enemies) {
      if (!enemy.alive || enemy.entering || enemy.exploding) continue;
      if (rectsOverlap(b.x - 2, b.y - 6, 4, 12, enemy.x, enemy.y, SPRITE_W, SPRITE_H)) {
        enemy.health -= BULLET_DAMAGE;
        bullets.splice(i, 1);
        if (enemy.health <= 0) {
          enemy.exploding = true;
          enemy.explodeStart = now;
        }
        break;
      }
    }
  }

  for (let i = balls.length - 1; i >= 0; i--) {
    const ball = balls[i];
    ball.x += ball.vx * (dt / 1000);
    ball.y += ball.vy * (dt / 1000);
    if (ball.y > canvas.height + 20) {
      balls.splice(i, 1);
      continue;
    }
    if (now > player.invincibleUntil &&
      rectsOverlap(ball.x - 7, ball.y - 7, 14, 14, player.x, player.y, SPRITE_W, SPRITE_H)) {
      balls.splice(i, 1);
      hearts--;
      player.invincibleUntil = now + INVINCIBLE_MS;
      updateHearts();
      if (hearts <= 0) {
        endGame(false);
      }
    }
  }

  if (enemiesSpawned && enemies.length > 0 && enemies.every((e) => !e.alive)) {
    endGame(true);
  }

  stars.forEach((s) => {
    s.y += s.speed * (dt / 1000);
    if (s.y > canvas.height) s.y = 0;
  });
}

function drawStars() {
  ctx.fillStyle = '#05050f';
  ctx.fillRect(0, 0, canvas.width, canvas.height);
  stars.forEach((s) => {
    ctx.globalAlpha = s.alpha;
    ctx.fillStyle = '#fff';
    ctx.fillRect(s.x, s.y, s.size, s.size);
  });
  ctx.globalAlpha = 1;
}

function drawHealthBar(enemy) {
  const w = SPRITE_W;
  const pct = Math.max(enemy.health, 0) / ENEMY_MAX_HEALTH;
  ctx.fillStyle = '#300';
  ctx.fillRect(enemy.x, enemy.y - 14, w, 6);
  ctx.fillStyle = '#f33';
  ctx.fillRect(enemy.x, enemy.y - 14, w * pct, 6);
  ctx.strokeStyle = '#800';
  ctx.strokeRect(enemy.x, enemy.y - 14, w, 6);

  ctx.fillStyle = '#fff';
  ctx.font = '10px monospace';
  ctx.textAlign = 'center';
  ctx.fillText(String(Math.max(enemy.health, 0)), enemy.x + w / 2, enemy.y - 18);
  ctx.textAlign = 'left';
}

function drawExplosion(enemy, now) {
  const t = (now - enemy.explodeStart) / 500;
  const cx = enemy.x + SPRITE_W / 2;
  const cy = enemy.y + SPRITE_H / 2;
  const colors = ['#ffcc00', '#ff6600', '#ff2200'];
  for (let i = 0; i < 10; i++) {
    const angle = (i / 10) * Math.PI * 2;
    const dist = t * 40 * (0.5 + (i % 3) * 0.3);
    const size = Math.max(6 - t * 6, 1);
    ctx.fillStyle = colors[i % colors.length];
    ctx.globalAlpha = Math.max(1 - t, 0);
    ctx.fillRect(cx + Math.cos(angle) * dist - size / 2, cy + Math.sin(angle) * dist - size / 2, size, size);
  }
  ctx.globalAlpha = 1;
}

function drawBullets() {
  bullets.forEach((b) => {
    ctx.save();
    ctx.shadowColor = '#ffee55';
    ctx.shadowBlur = 10;
    ctx.fillStyle = '#ffee55';
    ctx.fillRect(b.x - 2, b.y - 6, 4, 12);
    ctx.restore();
  });
}

function drawBalls() {
  balls.forEach((ball) => {
    ctx.save();
    ctx.shadowColor = '#ff2a2a';
    ctx.shadowBlur = 14;
    ctx.fillStyle = '#ff5050';
    ctx.beginPath();
    ctx.arc(ball.x, ball.y, 7, 0, Math.PI * 2);
    ctx.fill();
    ctx.restore();
  });
}

function drawPlayer(now) {
  const flashing = now < player.invincibleUntil && Math.floor(now / 100) % 2 === 0;
  ctx.globalAlpha = flashing ? 0.3 : 1;
  drawSprite(PLAYER_SPRITE, PLAYER_COLORS, player.x, player.y);
  ctx.globalAlpha = 1;
}

function draw(now) {
  drawStars();

  enemies.forEach((enemy) => {
    if (!enemy.alive) return;
    if (enemy.exploding) {
      drawExplosion(enemy, now);
      return;
    }
    drawSprite(ENEMY_SPRITE, ENEMY_COLORS, enemy.x, enemy.y);
    if (!enemy.entering) {
      drawHealthBar(enemy);
    }
  });

  drawBullets();
  drawBalls();
  drawPlayer(now);
}

function loop(now) {
  const dt = Math.min(now - lastTime, 50);
  lastTime = now;
  update(dt, now);
  draw(now);
  requestAnimationFrame(loop);
}

resetGame();
requestAnimationFrame(loop);
</script>
</body>
</html>
