<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Space Siege - My Arcade</title>
<link rel="stylesheet" href="style.css">
<style>
  canvas {
    image-rendering: pixelated;
  }
  #controls {
    position: absolute;
    bottom: 10px;
    left: 50%;
    transform: translateX(-50%);
    font-size: 0.85rem;
    color: #999;
    text-align: center;
  }
  #test-panel {
    position: fixed;
    top: 50%;
    right: 12px;
    transform: translateY(-50%);
    display: none;
    flex-direction: column;
    gap: 10px;
    z-index: 10;
  }
  #test-panel.visible {
    display: flex;
  }
  #test-panel button {
    padding: 10px 12px;
    font-family: monospace;
    font-size: 0.9rem;
    color: #ffd500;
    background: #000;
    border: 2px solid #ffd500;
    cursor: pointer;
  }
  #test-panel button.on {
    color: #000;
    background: #ffd500;
  }
</style>
</head>
<body>
<div id="wrap">
  <a class="back-link" href="index.html">Menu</a>
  <canvas id="game" width="640" height="680"></canvas>
  <div id="controls">A/D or &larr;/&rarr; move &middot; Space (hold) to fire</div>
  <div id="message">
    <span id="message-text"></span>
    <button id="restart">Play again</button>
  </div>
</div>
<div id="test-panel">
  <button id="test-invincible">Invincible: OFF</button>
  <button id="test-skip-2">Skip to Wave 2: OFF</button>
  <button id="test-skip-3">Skip to Wave 3: OFF</button>
</div>
<script>
const canvas = document.getElementById('game');
const ctx = canvas.getContext('2d');
const messageEl = document.getElementById('message');
const messageTextEl = document.getElementById('message-text');
const restartBtn = document.getElementById('restart');
const testPanel = document.getElementById('test-panel');
const testInvincibleBtn = document.getElementById('test-invincible');
const testSkipBtns = [
  { waveIndex: 1, label: 'Skip to Wave 2', el: document.getElementById('test-skip-2') },
  { waveIndex: 2, label: 'Skip to Wave 3', el: document.getElementById('test-skip-3') }
];

const TEST_CODE = '839';
const PIXEL = 5;
const START_HEARTS = 3;
const INVINCIBLE_MS = 1000;
const ENEMY_SPAWN_DELAY = 4000;
const ENEMY_ENTER_MS = 1500;
const FIRE_COOLDOWN = 1000 / 3;
const PLAYER_SPEED = 260;
const BULLET_SPEED = 720;
const BULLET_W = 6;
const BULLET_H = 18;
const BALL_SPEED_Y = 220;
const BALL_RADIUS = 21;
const ENEMY_MAX_HEALTH = 251;
const BULLET_DAMAGE = 25;
const WAVE_GAP_MS = 2000;
const ROW_CENTER_Y = 130;
const BIG_SPREAD = 130;
const STILL_AIM_JITTER = 150;
const WAVES = [
  ['normal', 'normal', 'normal', 'normal', 'normal', 'normal'],
  ['big', 'big', 'big', 'big'],
  ['boss']
];
const ENEMY_PIXEL = { normal: PIXEL, big: PIXEL * 1.5, boss: PIXEL * 1.5 * 1.5 };
const ENEMY_HEALTH = { normal: ENEMY_MAX_HEALTH, big: Math.round(ENEMY_MAX_HEALTH * 1.5), boss: 1001 };
const EXPLOSION_RATE = { normal: 1, big: 0.75, boss: 0.6 };
const BOSS_BALL_COUNT = 10;
const BOSS_PHASE2_HEALTH = 666;
const BOSS_PHASE3_HEALTH = 333;
const SHOT_INTERVAL = { 1: 4000, 2: 900, 3: 2000 / 3 };
const BOSS_FADE_MS = 1500;
const HOMING_MAX_VX = 50;
// Ball-to-ball spacing that clears the ship's 92px collision width plus the sideways drift of diagonal balls.
const BOSS_HOLE_GAP = 130;

const PLAYER_SPRITE = [
  '.Y......Y.',
  '.Y......Y.',
  '.YYYYYYYY.',
  'YYYYYYYYYY',
  'YYYKKKKYYY',
  'YYYYYYYYYY',
  'YY.YYYY.YY',
  'Y..YYYY..Y'
];
const PLAYER_COLORS = { Y: '#ffd500', K: '#141414' };

const ENEMY_SPRITE = [
  '..R....R..',
  '.RRR..RRR.',
  'RRRRRRRRRR',
  'RRRKKKKRRR',
  'RRRRRRRRRR',
  '..R.RR.R..',
  '.R.R..R.R.',
  'R.R....R.R'
];
const ENEMY_COLORS = { R: '#ff2a2a', K: '#141414' };
const BOSS_PHASE2_COLORS = { R: '#8b0000', K: '#141414' };

const HEART_SPRITE = [
  '.RR.RR.',
  'RRRRRRR',
  'RRRRRRR',
  '.RRRRR.',
  '..RRR..',
  '...R...'
];
const HEART_FULL_COLORS = { R: '#ff3355' };
const HEART_EMPTY_COLORS = { R: '#2a0f16' };
const HEART_PIXEL = 5;
const HEART_W = HEART_SPRITE[0].length * HEART_PIXEL;
const HEART_H = HEART_SPRITE.length * HEART_PIXEL;
const HEART_GAP = 10;

const SPRITE_W = PLAYER_SPRITE[0].length * PIXEL;
const SPRITE_H = PLAYER_SPRITE.length * PIXEL;
const TURRET_COLS = [1, 8];

function drawSprite(grid, colors, x, y, pixelSize) {
  const size = pixelSize || PIXEL;
  for (let row = 0; row < grid.length; row++) {
    for (let col = 0; col < grid[row].length; col++) {
      const ch = grid[row][col];
      if (ch === '.') continue;
      ctx.fillStyle = colors[ch];
      ctx.fillRect(Math.round(x + col * size), Math.round(y + row * size), Math.ceil(size), Math.ceil(size));
    }
  }
}

function drawHearts() {
  const totalWidth = START_HEARTS * HEART_W + (START_HEARTS - 1) * HEART_GAP;
  const startX = canvas.width - totalWidth - 16;
  const y = canvas.height - HEART_H - 14;
  for (let i = 0; i < START_HEARTS; i++) {
    const x = startX + i * (HEART_W + HEART_GAP);
    const filled = i < hearts;
    drawSprite(HEART_SPRITE, filled ? HEART_FULL_COLORS : HEART_EMPTY_COLORS, x, y, HEART_PIXEL);
  }
}

const stars = [];
for (let i = 0; i < 120; i++) {
  stars.push({
    x: Math.random() * canvas.width,
    y: Math.random() * canvas.height,
    size: Math.random() < 0.8 ? 1 : 2,
    speed: 10 + Math.random() * 30,
    alpha: 0.3 + Math.random() * 0.7
  });
}

let player, bullets, enemies, balls, hearts, gameOver, wave, nextWaveAt, nextTurret, spaceHeld, fireCooldown, leftHeld, rightHeld, lastTime;
let typedKeys = '';
let testInvincible = false;
let testSkipWave = null;

function makeEnemy(type, cx, now) {
  const pixel = ENEMY_PIXEL[type];
  const w = ENEMY_SPRITE[0].length * pixel;
  const h = ENEMY_SPRITE.length * pixel;
  return {
    type,
    pixel,
    w,
    h,
    x: cx - w / 2,
    y: -h,
    targetY: ROW_CENTER_Y - h / 2,
    entering: true,
    enterStart: now,
    health: ENEMY_HEALTH[type],
    maxHealth: ENEMY_HEALTH[type],
    phase: 1,
    phaseStart: 0,
    alive: true,
    exploding: false,
    explodeStart: 0,
    nextShotTime: 0
  };
}

function spawnWave(index, now) {
  const types = WAVES[index];
  enemies = types.map((type, i) => makeEnemy(type, canvas.width * ((i + 1) / (types.length + 1)), now));
}

function resetGame() {
  player = {
    x: canvas.width / 2 - SPRITE_W / 2,
    y: canvas.height - 90,
    vx: 0,
    invincibleUntil: 0
  };
  bullets = [];
  enemies = [];
  balls = [];
  hearts = START_HEARTS;
  gameOver = false;
  wave = testSkipWave === null ? -1 : testSkipWave - 1;
  nextWaveAt = performance.now() + ENEMY_SPAWN_DELAY;
  nextTurret = 0;
  spaceHeld = false;
  fireCooldown = 0;
  leftHeld = false;
  rightHeld = false;
  lastTime = performance.now();

  messageEl.style.display = 'none';
}

function endGame(won) {
  gameOver = true;
  messageTextEl.textContent = won ? 'You Win!' : 'You Lose!';
  messageEl.style.display = 'block';
}

window.addEventListener('keydown', (e) => {
  const key = e.key.toLowerCase();
  if (['arrowleft', 'arrowright', 'a', 'd', ' '].includes(key)) {
    e.preventDefault();
  }
  if (!e.repeat) {
    typedKeys = (typedKeys + key).slice(-TEST_CODE.length);
    if (typedKeys === TEST_CODE) testPanel.classList.add('visible');
  }
  if (gameOver) return;
  if (key === 'a' || key === 'arrowleft') leftHeld = true;
  else if (key === 'd' || key === 'arrowright') rightHeld = true;
  else if (key === ' ') spaceHeld = true;
});

window.addEventListener('keyup', (e) => {
  const key = e.key.toLowerCase();
  if (key === 'a' || key === 'arrowleft') leftHeld = false;
  else if (key === 'd' || key === 'arrowright') rightHeld = false;
  else if (key === ' ') spaceHeld = false;
});

restartBtn.addEventListener('click', resetGame);

function jumpToWave(index) {
  wave = index;
  spawnWave(index, performance.now());
  nextWaveAt = null;
  balls = [];
}

// Blur so a later Space press fires the ship instead of re-clicking the focused button.
testInvincibleBtn.addEventListener('click', () => {
  testInvincible = !testInvincible;
  testInvincibleBtn.textContent = `Invincible: ${testInvincible ? 'ON' : 'OFF'}`;
  testInvincibleBtn.classList.toggle('on', testInvincible);
  testInvincibleBtn.blur();
});

testSkipBtns.forEach((btn) => {
  btn.el.addEventListener('click', () => {
    testSkipWave = testSkipWave === btn.waveIndex ? null : btn.waveIndex;
    testSkipBtns.forEach((other) => {
      const on = testSkipWave === other.waveIndex;
      other.el.textContent = `${other.label}: ${on ? 'ON' : 'OFF'}`;
      other.el.classList.toggle('on', on);
    });
    btn.el.blur();
    if (!gameOver) jumpToWave(testSkipWave === null ? 0 : testSkipWave);
  });
});

const laserSound = new Audio('lazer.mp3');
laserSound.preload = 'auto';
const explosionSound = new Audio('explosion.mp3');
explosionSound.preload = 'auto';

function playSound(base, volume, rate = 1) {
  const sound = base.cloneNode();
  sound.volume = volume;
  sound.preservesPitch = false;
  sound.playbackRate = rate;
  sound.play().catch(() => {});
}

function fireBullet() {
  playSound(laserSound, 0.1);
  const col = TURRET_COLS[nextTurret];
  nextTurret = 1 - nextTurret;
  bullets.push({
    x: player.x + col * PIXEL + PIXEL / 2,
    y: player.y
  });
}

// Keeping at least 2 balls outside each hole stops the steepest diagonals from closing it.
function bossFire(originX, originY) {
  const minGap = BALL_RADIUS * 2 + 2;
  const firstHole = 2 + Math.floor(Math.random() * 3);
  const secondHole = BOSS_BALL_COUNT - 2 - Math.floor(Math.random() * 3);
  const slack = canvas.width - SPRITE_W - minGap * (BOSS_BALL_COUNT - 3) - BOSS_HOLE_GAP * 2;
  const shifts = Array.from({ length: BOSS_BALL_COUNT }, () => Math.random() * slack).sort((a, b) => a - b);
  let baseX = SPRITE_W / 2;
  shifts.forEach((shift, i) => {
    if (i > 0) baseX += i === firstHole || i === secondHole ? BOSS_HOLE_GAP : minGap;
    const dx = baseX + shift - originX;
    const dy = player.y - originY;
    const distance = Math.hypot(dx, dy);
    balls.push({
      x: originX,
      y: originY,
      vx: (dx / distance) * BALL_SPEED_Y,
      vy: (dy / distance) * BALL_SPEED_Y
    });
  });
}

function enemyFire(enemy) {
  const originX = enemy.x + enemy.w / 2;
  const originY = enemy.y + enemy.h;
  if (enemy.type === 'boss' && enemy.phase === 1) {
    bossFire(originX, originY);
    return;
  }
  if (enemy.phase === 3) {
    balls.push({
      x: originX,
      y: originY,
      vx: 0,
      vy: BALL_SPEED_Y * 2,
      homing: true
    });
    return;
  }
  const dy = player.y - originY;
  const t = dy / BALL_SPEED_Y;
  const recordedVx = Math.random() < 0.4 ? -player.vx : player.vx;
  const speedMultiplier = 1 - (35 + Math.random() * 55) / 100;
  let predictedX = player.x + SPRITE_W / 2 + recordedVx * speedMultiplier * t;
  if (recordedVx === 0) {
    predictedX += (Math.random() * 2 - 1) * STILL_AIM_JITTER;
  }
  predictedX = Math.min(Math.max(predictedX, SPRITE_W / 2), canvas.width - SPRITE_W / 2);
  const offsets = enemy.type === 'big' || enemy.phase === 2 ? [-BIG_SPREAD, 0, BIG_SPREAD] : [0];
  offsets.forEach((offset) => {
    balls.push({
      x: originX,
      y: originY,
      vx: (predictedX + offset - originX) / t,
      vy: BALL_SPEED_Y
    });
  });
}

function rectsOverlap(ax, ay, aw, ah, bx, by, bw, bh) {
  return ax < bx + bw && ax + aw > bx && ay < by + bh && ay + ah > by;
}

function update(dt, now) {
  if (gameOver) return;

  player.vx = rightHeld && !leftHeld ? PLAYER_SPEED : (leftHeld && !rightHeld ? -PLAYER_SPEED : 0);
  player.x += player.vx * (dt / 1000);
  player.x = Math.min(Math.max(player.x, 0), canvas.width - SPRITE_W);

  fireCooldown = Math.max(fireCooldown - dt, 0);
  if (spaceHeld && fireCooldown <= 0) {
    fireBullet();
    fireCooldown = FIRE_COOLDOWN;
  }

  if (nextWaveAt !== null && now >= nextWaveAt) {
    wave++;
    spawnWave(wave, now);
    nextWaveAt = null;
  }

  enemies.forEach((enemy) => {
    if (!enemy.alive) return;

    if (enemy.exploding) {
      if (now - enemy.explodeStart > 500) {
        enemy.alive = false;
      }
      return;
    }

    if (enemy.entering) {
      const t = Math.min((now - enemy.enterStart) / ENEMY_ENTER_MS, 1);
      enemy.y = -enemy.h + (enemy.targetY + enemy.h) * t;
      if (t >= 1) {
        enemy.entering = false;
        enemy.nextShotTime = now + 1000 + Math.random() * 1500;
      }
      return;
    }

    if (now >= enemy.nextShotTime) {
      enemyFire(enemy);
      enemy.nextShotTime = now + SHOT_INTERVAL[enemy.phase];
    }
  });

  for (let i = bullets.length - 1; i >= 0; i--) {
    const b = bullets[i];
    b.y -= BULLET_SPEED * (dt / 1000);
    if (b.y < -20) {
      bullets.splice(i, 1);
      continue;
    }
    for (const enemy of enemies) {
      if (!enemy.alive || enemy.entering || enemy.exploding) continue;
      if (rectsOverlap(b.x - BULLET_W / 2, b.y - BULLET_H / 2, BULLET_W, BULLET_H, enemy.x, enemy.y, enemy.w, enemy.h)) {
        enemy.health -= BULLET_DAMAGE;
        bullets.splice(i, 1);
        if (enemy.type === 'boss') {
          const phase = enemy.health <= BOSS_PHASE3_HEALTH ? 3 : (enemy.health <= BOSS_PHASE2_HEALTH ? 2 : 1);
          if (phase !== enemy.phase) {
            enemy.phase = phase;
            enemy.phaseStart = now;
            enemy.nextShotTime = now + SHOT_INTERVAL[phase];
          }
        }
        if (enemy.health <= 0) {
          enemy.exploding = true;
          enemy.explodeStart = now;
          playSound(explosionSound, 0.3, EXPLOSION_RATE[enemy.type]);
        }
        break;
      }
    }
  }

  for (let i = balls.length - 1; i >= 0; i--) {
    const ball = balls[i];
    if (ball.homing && ball.y < player.y) {
      const timeLeft = (player.y - ball.y) / ball.vy;
      const aimVx = (player.x + SPRITE_W / 2 - ball.x) / timeLeft;
      ball.vx = Math.min(Math.max(aimVx, -HOMING_MAX_VX), HOMING_MAX_VX);
    }
    ball.x += ball.vx * (dt / 1000);
    ball.y += ball.vy * (dt / 1000);
    if (ball.y > canvas.height + 20) {
      balls.splice(i, 1);
      continue;
    }
    if (!testInvincible && now > player.invincibleUntil &&
      rectsOverlap(ball.x - BALL_RADIUS, ball.y - BALL_RADIUS, BALL_RADIUS * 2, BALL_RADIUS * 2, player.x, player.y, SPRITE_W, SPRITE_H)) {
      balls.splice(i, 1);
      hearts--;
      player.invincibleUntil = now + INVINCIBLE_MS;
      if (hearts <= 0) {
        endGame(false);
      }
    }
  }

  if (!gameOver && nextWaveAt === null && enemies.every((e) => !e.alive)) {
    if (wave < WAVES.length - 1) {
      nextWaveAt = now + WAVE_GAP_MS;
    } else {
      endGame(true);
    }
  }

  stars.forEach((s) => {
    s.y += s.speed * (dt / 1000);
    if (s.y > canvas.height) s.y = 0;
  });
}

function drawStars() {
  ctx.fillStyle = '#05050f';
  ctx.fillRect(0, 0, canvas.width, canvas.height);
  stars.forEach((s) => {
    ctx.globalAlpha = s.alpha;
    ctx.fillStyle = '#fff';
    ctx.fillRect(s.x, s.y, s.size, s.size);
  });
  ctx.globalAlpha = 1;
}

function drawHealthBar(enemy) {
  const w = enemy.w;
  const pct = Math.max(enemy.health, 0) / enemy.maxHealth;
  ctx.fillStyle = '#300';
  ctx.fillRect(enemy.x, enemy.y - 14, w, 6);
  ctx.fillStyle = '#f33';
  ctx.fillRect(enemy.x, enemy.y - 14, w * pct, 6);
  ctx.strokeStyle = '#800';
  ctx.strokeRect(enemy.x, enemy.y - 14, w, 6);
  if (enemy.type === 'boss') {
    ctx.fillStyle = '#ffd500';
    [BOSS_PHASE2_HEALTH, BOSS_PHASE3_HEALTH].forEach((health) => {
      ctx.fillRect(enemy.x + w * (health / enemy.maxHealth) - 1, enemy.y - 15, 2, 8);
    });
  }

  ctx.fillStyle = '#fff';
  ctx.font = '10px monospace';
  ctx.textAlign = 'center';
  ctx.fillText(String(Math.max(enemy.health, 0)), enemy.x + w / 2, enemy.y - 18);
  ctx.textAlign = 'left';
}

function drawExplosion(enemy, now) {
  const t = (now - enemy.explodeStart) / 500;
  const cx = enemy.x + enemy.w / 2;
  const cy = enemy.y + enemy.h / 2;
  const scale = enemy.pixel / PIXEL;
  const colors = ['#ffcc00', '#ff6600', '#ff2200'];
  for (let i = 0; i < 10; i++) {
    const angle = (i / 10) * Math.PI * 2;
    const dist = t * 40 * scale * (0.5 + (i % 3) * 0.3);
    const size = Math.max((6 - t * 6) * scale, 1);
    ctx.fillStyle = colors[i % colors.length];
    ctx.globalAlpha = Math.max(1 - t, 0);
    ctx.fillRect(cx + Math.cos(angle) * dist - size / 2, cy + Math.sin(angle) * dist - size / 2, size, size);
  }
  ctx.globalAlpha = 1;
}

function drawBullets() {
  bullets.forEach((b) => {
    ctx.save();
    ctx.shadowColor = '#ffee55';
    ctx.shadowBlur = 10;
    ctx.fillStyle = '#ffee55';
    ctx.fillRect(b.x - BULLET_W / 2, b.y - BULLET_H / 2, BULLET_W, BULLET_H);
    ctx.restore();
  });
}

function drawBalls() {
  balls.forEach((ball) => {
    ctx.save();
    ctx.shadowColor = '#ff2a2a';
    ctx.shadowBlur = 24;
    ctx.fillStyle = ball.homing ? '#8b0000' : '#ff5050';
    ctx.beginPath();
    ctx.arc(ball.x, ball.y, BALL_RADIUS, 0, Math.PI * 2);
    ctx.fill();
    ctx.restore();
  });
}

function drawPlayer(now) {
  const flashing = now < player.invincibleUntil && Math.floor(now / 100) % 2 === 0;
  ctx.globalAlpha = flashing ? 0.3 : 1;
  drawSprite(PLAYER_SPRITE, PLAYER_COLORS, player.x, player.y);
  ctx.globalAlpha = 1;
}

function enemyLook(enemy, now) {
  if (enemy.phase === 1) return { colors: ENEMY_COLORS, glowBlur: 0 };
  if (enemy.phase === 2) return { colors: BOSS_PHASE2_COLORS, glowColor: '#ff2a2a', glowBlur: 14 };
  const fade = Math.min((now - enemy.phaseStart) / BOSS_FADE_MS, 1);
  return {
    colors: { R: `rgb(${Math.round(139 * (1 - fade))}, 0, 0)`, K: '#141414' },
    glowColor: '#ff0000',
    glowBlur: 14 + fade * 26
  };
}

function draw(now) {
  drawStars();

  enemies.forEach((enemy) => {
    if (!enemy.alive) return;
    if (enemy.exploding) {
      drawExplosion(enemy, now);
      return;
    }
    const look = enemyLook(enemy, now);
    if (look.glowBlur > 0) {
      ctx.save();
      ctx.shadowColor = look.glowColor;
      ctx.shadowBlur = look.glowBlur;
      drawSprite(ENEMY_SPRITE, look.colors, enemy.x, enemy.y, enemy.pixel);
      ctx.restore();
    }
    drawSprite(ENEMY_SPRITE, look.colors, enemy.x, enemy.y, enemy.pixel);
    if (!enemy.entering) {
      drawHealthBar(enemy);
    }
  });

  drawBullets();
  drawBalls();
  drawPlayer(now);
  drawHearts();
}

function loop(now) {
  const dt = Math.min(now - lastTime, 50);
  lastTime = now;
  update(dt, now);
  draw(now);
  requestAnimationFrame(loop);
}

resetGame();
requestAnimationFrame(loop);
</script>
</body>
</html>
