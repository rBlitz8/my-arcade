<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>My Arcade</title>
<link rel="stylesheet" href="style.css">
<style>
  #menu {
    text-align: center;
  }
  #menu h1 {
    font-size: 3rem;
    margin-bottom: 40px;
  }
  .games {
    display: flex;
    gap: 24px;
    justify-content: center;
    flex-wrap: wrap;
  }
  .game-card {
    display: block;
    width: 220px;
    padding: 24px;
    background: #222;
    border: 2px solid #444;
    border-radius: 12px;
    text-decoration: none;
    color: #fff;
    transition: transform 0.15s, border-color 0.15s;
  }
  .game-card:hover {
    transform: translateY(-4px);
    border-color: #0f0;
  }
  .game-card h2 {
    margin: 0 0 8px;
    font-size: 1.4rem;
  }
  .game-card p {
    margin: 0;
    font-size: 0.9rem;
    color: #aaa;
  }
</style>
</head>
<body>
<div id="menu">
  <h1>Hello from my arcade</h1>
  <div class="games">
    <a class="game-card" href="paddle.html">
      <h2>Paddle Bounce</h2>
      <p>Bounce the ball 15 times without letting it hit the floor.</p>
    </a>
    <a class="game-card" href="laser.html">
      <h2>Laser Dodge</h2>
      <p>Crouch, jump, and dodge lanes to survive 20 laser waves.</p>
    </a>
    <a class="game-card" href="space.html">
      <h2>Space Siege</h2>
      <p>Blast 3 enemy ships before they wear down your 3 hearts.</p>
    </a>
  </div>
</div>
</body>
</html>
